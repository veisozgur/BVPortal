services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bvportal-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ChangeThis_StrongPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - bvportal-sql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  bvportal-sql-data:

name: build

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore solution
        run: dotnet restore BVPortal.sln

      - name: Restore web
        run: dotnet restore src/BV.Web/BV.Web.csproj

      - name: Build solution
        run: dotnet build BVPortal.sln --configuration Release --no-restore

      - name: Build web
        run: dotnet build src/BV.Web/BV.Web.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test BVPortal.sln --configuration Release --no-build --verbosity normal
